
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPA / CGPA Calculator</title>
  
  <link rel="stylesheet" href="style.css">
</head>

<body>
   <div class="theme-switch">
    <span>☀️</span>

    <label class="switch">
        <input type="checkbox" id="theme-toggle">
        <span class="slider"></span>
    </label>

    <span>🌙</span>
</div>
  <div class="card">
    <h1>GPA / CGPA Calculator</h1>
    <p>Enter your subject credits and grade points, then optionally add previous CGPA data.</p>

    <div id="subjects"></div>

    <button id="add-subject">Add Subject</button>
    <button id="remove-subject" type="button">Remove Subject</button>

    <div class="card" style="margin-top: 1rem;">
      <h2>CGPA Input</h2>
      <label for="prev-cgpa">Previous CGPA</label>
      <input id="prev-cgpa" type="number" step="0.01" min="0" max="10" placeholder="e.g. 3.50" />

      <label for="prev-credits">Previous Total Credits</label>
      <input id="prev-credits" type="number" step="1" min="0" placeholder="e.g. 12" />
    </div>

    <button id="calculate">Calculate GPA / CGPA</button>

    <div id="output" class="result" hidden></div>
  </div>
  
  <script src="script.js"></script>
  
</body>
</html>
